<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          const isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch {
          // ignore
        }
      })();
    </script>
    <style>
      html {
        background: #f9f8f4;
        color: #44403c;
      }
      html.dark {
        background: #2a2520;
        color: #e8e6e1;
      }
      body {
        margin: 0;
        background: transparent;
        color: inherit;
      }
    </style>
    <title>YourTJ社区导航</title>
    <meta name="description" content="YourTJ社区导航 - 选课、积分与开发文档" />

    <!-- Favicons (SVG is not supported by all mobile browsers) -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Local fonts (preloaded to avoid FOUT/CLS) -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/nunito-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/gochi-hand.woff2" crossorigin />
    <link rel="preload" as="image" href="%BASE_URL%logo.png" type="image/png" />
    <link rel="preconnect" href="https://v1.hitokoto.cn" crossorigin />

    <!-- Hitokoto font uses a fast system calligraphy stack (no remote font request). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
