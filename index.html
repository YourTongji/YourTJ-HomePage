<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Umami 访问统计：待首屏空闲后加载，避免抢占渲染主线程。 -->
    <script>
      window.addEventListener(
        'load',
        () =>
          window.setTimeout(() => {
            const script = document.createElement('script');
            script.src = 'https://umi.yourtj.de/script.js';
            script.dataset.websiteId = '296b54f1-13c3-4356-a5ae-0a786c06330f';
            document.head.appendChild(script);
          }, 2000),
        { once: true },
      );
    </script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          const isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch {
          // Ignore storage failures; the app falls back to system preference.
        }
      })();
    </script>
    <style>
      html {
        background: #ffffff;
        color: #1a1a1a;
      }
      html.dark {
        background: #1a1a1a;
        color: #ffffff;
      }
      body {
        margin: 0;
        background: transparent;
        color: inherit;
      }
    </style>

    <title>YourTJ - 同济大学学生社区</title>
    <meta
      name="description"
      content="YourTJ 是同济大学学生社区。进入选课社区，或下载 App，在手机上查看课程、评课和模拟排课。"
    />

    <meta property="og:title" content="YourTJ - 同济大学学生社区" />
    <meta
      property="og:description"
      content="连接校园，也连接每一种可能。选课社区与 YourTJ App 的入口。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://yourtj.de/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.cn/s/fasterone/v20/H4ciBXCHmdfClFb-vWhf-LyYh4y0YzA.woff2" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.cn/css2?family=Faster+One&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Faster+One&display=swap" /></noscript>

    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preload" as="image" href="%BASE_URL%logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
