<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          const isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch {
          // ignore
        }
      })();
    </script>
    <title>YourTJ社区导航</title>
    <meta name="description" content="YourTJ社区导航 - 选课、积分与开发文档" />

    <!-- Favicons (SVG is not supported by all mobile browsers) -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Google Fonts (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://v1.hitokoto.cn" crossorigin />

    <!-- Main typography -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
      />
    </noscript>

    <!-- More artistic handwriting for Hitokoto only -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=optional"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=optional" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
